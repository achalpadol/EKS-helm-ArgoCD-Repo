apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-app-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/achalpadol/EKS-Helm-Chart.git
    targetRevision: main
    path: dev-chart

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://1A7C74880AB81E1452C008B343D250D3.gr7.ap-south-1.eks.amazonaws.com
    namespace: app-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
