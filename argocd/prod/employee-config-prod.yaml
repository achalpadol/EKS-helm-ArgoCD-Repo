apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-config-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/achalpadol/EKS-helm-ArgoCD-Repo.git
    targetRevision: main
    path: dev-chart

    helm:
      valueFiles:
        - values-prod.yaml

      parameters:
        - name: component
          value: config

  destination:
    server: https://7CCA12B078E77BB8AEA7A2549424BA2A.gr7.ap-south-1.eks.amazonaws.com
    namespace: app-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
