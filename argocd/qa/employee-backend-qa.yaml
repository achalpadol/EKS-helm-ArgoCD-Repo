apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-backend-qa
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/achalpadol/EKS-Helm-Chart.git
    targetRevision: main
    path: dev-chart

    helm:
      valueFiles:
        - values-qa.yaml

      parameters:
        - name: frontend.enabled
          value: "false"
        - name: backend.enabled
          value: "true"
        - name: database.enabled
          value: "false"
        - name: configMap.enabled
          value: "false"
        - name: secret.enabled
          value: "false"

  destination:
    server: https://1A7C74880AB81E1452C008B343D250D3.gr7.ap-south-1.eks.amazonaws.com
    namespace: app-qa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
