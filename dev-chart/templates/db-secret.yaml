{{- $component := .Values.component | default "all" }}
{{- if .Values.secret.enabled }}
{{- if (or (eq $component "all") (eq $component "config"))}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.secret.stringData.MYSQL_ROOT_PASSWORD | quote }}
  MYSQL_DATABASE: {{ .Values.secret.stringData.MYSQL_DATABASE | quote }}
  MYSQL_USER: {{ .Values.secret.stringData.MYSQL_USER | quote }}
  MYSQL_PASSWORD: {{ .Values.secret.stringData.MYSQL_PASSWORD | quote }}
{{- end }}
{{- end }}