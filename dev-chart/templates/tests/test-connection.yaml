{{- $component := .Values.component | default "all" }}
{{- if or (eq $component "all") (eq $component "frontend") }}
apiVersion: v1
kind: Pod
metadata:
name: "{{ .Release.Name }}-{{ .Chart.Name }}-test-connection"
labels:
helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
app.kubernetes.io/name: {{ .Chart.Name }}
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
annotations:
"helm.sh/hook": test
spec:
containers:
- name: wget
image: busybox
command: ['wget']
args: ['http://frontend:80']
restartPolicy: Never
{{- end }}
