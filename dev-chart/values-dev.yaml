
frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  image:
    repository: "achalpadol/helm-frontend-dev"
    tag: "32cddc404dea25dbdc2ef1cd227b39b273e7b511"
    pullPolicy: IfNotPresent
  service:
    enabled: true
    name: frontend
    type: ClusterIP
    port: 80
    targetPort: 80
backend:
  enabled: true
  name: backend
  replicaCount: 1
  image:
    repository: "achalpadol/helm-backend-dev"
    tag: "5026edc692667675f396bad476136c989488bb7f"
    pullPolicy: IfNotPresent
  configMapName: employee-cm
  secretName: mysql-secret
  service:
    enabled: true
    name: backend
    type: ClusterIP
    port: 5000
    targetPort: 5000
database:
  enabled: true
  name: database
  replicaCount: 1
  image:
    repository: "achalpadol/helm-db-dev"
    tag: "ed79ee887bf97a9838e7fc00d032dce5b0b2828a"
    pullPolicy: IfNotPresent
  secretName: mysql-secret
  service:
    enabled: true
    name: database
    type: ClusterIP
    port: 3306
    targetPort: 3306
  persistence:
    enabled: true
    size: 10Gi
configMap:
  enabled: true
  name: employee-cm
  data:
    DB_HOST: database
    DB_PORT: "3306"
secret:
  enabled: true
  name: mysql-secret
  stringData:
    MYSQL_ROOT_PASSWORD: "rootpassword"
    MYSQL_DATABASE: employee_db
    MYSQL_USER: employee
    MYSQL_PASSWORD: "employee123"
ingress:
  enabled: true
  name: employee-management-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  host: employee.dev.local
